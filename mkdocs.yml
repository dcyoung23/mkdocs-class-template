site_name: mkdocs Class Template
site_url: https://dcyoung23.github.io/mkdocs-class-template/
repo_url: https://github.com/dcyoung23/mkdocs-class-template
repo_name: mkdocs-class-template
nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - Notes:
    - Week 1: notes/week_1.md
    - Week 2: notes/week_2.md
theme:
  name: material
  font:
    text: Roboto
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - header.autohide
    - announce.dismiss
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.integrate
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github 
      link: https://github.com/dcyoung23
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/dcyoung23/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@Professor-Young
    - icon: fontawesome/brands/creative-commons
      link: https://creativecommons.org/licenses/by-nc-sa/4.0/
      name: CC BY-NC-SA 4.0
  copyright: >
    Unless otherwise noted, the materials on this website and repository are freely available under the
    <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License</a>.
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - macros
  - open-in-new-tab
